<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUILD SIGNAL | 회원관리</title><link rel="stylesheet" href="/styles.css"><style>.admin-wrap{max-width:1100px;margin:35px auto;padding:0 20px}.user-row{display:grid;grid-template-columns:1.2fr 1fr 1fr .8fr auto;gap:12px;align-items:center;padding:15px;border-bottom:1px solid #edf0f5;font-size:13px}.user-row.head{font-weight:700;background:#f7f9fc}.status{padding:4px 8px;border-radius:20px;background:#fff3d6}.status.approved{background:#e2f7eb}.actions{display:flex;gap:6px}.actions button{border:0;border-radius:7px;padding:8px 10px;cursor:pointer}.approve{background:#17365f;color:#fff}.reject{background:#fee4e2;color:#9b1c1c}@media(max-width:720px){.user-row{grid-template-columns:1fr 1fr}.user-row.head{display:none}}</style></head><body><main class="admin-wrap"><a href="/" class="button light">← 대시보드</a><h1>회원 관리</h1><p class="muted">신규 가입자의 정보를 확인하고 서비스 이용을 승인하세요.</p><section class="panel" style="padding:18px;margin:20px 0"><h2>나라장터 실제 입찰공고 수집</h2><p class="muted">최근 최대 7일의 공사 입찰공고를 가져와 BUILD SIGNAL 현장 DB에 저장합니다. 관리자만 실행할 수 있습니다.</p><button class="button primary" id="g2bSync">최근 7일 공고 수집</button><span id="g2bStatus" style="margin-left:12px"></span><pre id="g2bResult" style="white-space:pre-wrap"></pre></section><div class="panel" id="users">불러오는 중...</div></main><script>
async function load(){const r=await fetch('/api/admin/users');if(r.status===401){location.href='/login.html';return;}if(!r.ok){document.getElementById('users').textContent='관리자 권한이 필요합니다.';return;}const d=await r.json();const el=document.getElementById('users');el.innerHTML='<div class="user-row head"><span>이메일</span><span>회사명</span><span>담당자</span><span>상태</span><span>관리</span></div>'+d.rows.map(u=>`<div class="user-row"><span>${esc(u.email)}</span><span>${esc(u.company_name)}</span><span>${esc(u.contact_name)}</span><span><i class="status ${u.status}">${u.status==='approved'?'승인':'대기'}</i></span><span class="actions">${u.status!=='approved'?`<button class="approve" onclick="act(${u.id},'approve')">승인</button>`:''}<button class="reject" onclick="act(${u.id},'reject')">삭제</button></span></div>`).join('')||'가입 회원이 없습니다.';}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function act(id,action){if(!confirm(action==='approve'?'이 회원의 이용을 승인할까요?':'이 회원을 삭제할까요?'))return;const r=await fetch(`/api/admin/users/${id}/${action}`,{method:'POST'});const d=await r.json();if(!r.ok)alert(d.error||'처리 실패');load();}
async function syncG2b(){
  const btn=document.getElementById('g2bSync');
  const status=document.getElementById('g2bStatus');
  const output=document.getElementById('g2bResult');
  btn.disabled=true;
  status.textContent='나라장터 공고 조회 중...';
  output.textContent='';
  try{
    const response=await fetch('/api/admin/g2b/sync',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'same-origin',
      body:JSON.stringify({days:7})
    });
    const data=await response.json().catch(()=>({error:'서버에서 JSON 응답을 받지 못했습니다.'}));
    if(!response.ok){
      const message=data.error||`요청 실패 (HTTP ${response.status})`;
      if(response.status===401||response.status===403) throw new Error(`${message} — 관리자 로그인 및 권한을 확인하세요.`);
      throw new Error(message);
    }
    status.textContent='수집 완료';
    output.textContent=[
      `조회 공고: ${data.received ?? 0}건`,
      `신규 저장: ${data.inserted ?? 0}건`,
      `기존 갱신: ${data.updated ?? 0}건`,
      `건너뜀: ${data.skipped ?? 0}건`,
      `조회 기간: ${data.range?.from || '-'} ~ ${data.range?.to || '-'}`,
      data.note || ''
    ].filter(Boolean).join('\n');
  }catch(error){
    status.textContent='수집 실패';
    output.textContent=error.message;
  }finally{
    btn.disabled=false;
  }
}
document.getElementById('g2bSync').addEventListener('click',syncG2b);
load();
</script></body></html>
