<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUILD SIGNAL | 로그인·회원가입</title><link rel="stylesheet" href="/styles.css"><style>
.login-card{width:min(440px,calc(100% - 32px));}.auth-tabs{display:flex;gap:8px;margin:18px 0}.auth-tabs button{flex:1;padding:11px;border:1px solid #e2e8f0;border-radius:9px;background:#f7f9fc;cursor:pointer;font-weight:700}.auth-tabs button.active{background:#162b4d;color:white;border-color:#162b4d}.login-card label{display:block;margin:12px 0;font-size:13px;color:#526078}.login-card input{display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #dbe2ec;border-radius:8px}.auth-note{font-size:12px;line-height:1.6;color:#718096}.error{color:#b42318;font-size:13px;margin-top:12px;white-space:pre-wrap}
</style></head><body class="login-body"><div class="login-card"><div class="brand-mark">BS</div><h1>BUILD SIGNAL</h1><p>건설현장 영업정보 플랫폼</p><div class="auth-tabs"><button id="loginTab" class="active" type="button">로그인</button><button id="registerTab" type="button">회원가입</button></div>
<form id="loginForm"><label>이메일<input type="email" name="email" autocomplete="username" required></label><label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label><button class="button primary" style="width:100%">로그인</button></form>
<form id="registerForm" hidden><label>회사명<input name="companyName" maxlength="160" required></label><label>담당자명<input name="contactName" maxlength="80" required></label><label>이메일<input type="email" name="email" autocomplete="email" required></label><label>비밀번호 (10자 이상)<input type="password" name="password" minlength="10" autocomplete="new-password" required></label><button class="button primary" style="width:100%">회원가입 신청</button><p class="auth-note">가입 후 관리자 승인 완료 시 서비스를 이용할 수 있습니다.</p></form><div id="error" class="error" role="status"></div></div>
<script>
const $=id=>document.getElementById(id);function mode(register){$('loginForm').hidden=register;$('registerForm').hidden=!register;$('loginTab').classList.toggle('active',!register);$('registerTab').classList.toggle('active',register);$('error').textContent='';}$('loginTab').onclick=()=>mode(false);$('registerTab').onclick=()=>mode(true);
async function send(form,url){const data=Object.fromEntries(new FormData(form));const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw new Error(d.error||'요청을 처리하지 못했습니다.');return d;}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await send(e.target,'/api/login');location.href='/';}catch(err){$('error').textContent=err.message;}};
$('registerForm').onsubmit=async e=>{e.preventDefault();try{const d=await send(e.target,'/api/register');mode(false);$('error').textContent=d.message;}catch(err){$('error').textContent=err.message;}};
fetch('/api/me').then(r=>{if(r.ok)location.href='/';}).catch(()=>{});
</script></body></html>
