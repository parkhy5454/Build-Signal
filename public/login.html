<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUILD SIGNAL 관리자 로그인</title><link rel="stylesheet" href="/styles.css"></head><body class="login-body"><form id="loginForm" class="login-card"><div class="brand-mark">BS</div><h1>BUILD SIGNAL</h1><p>관리자 로그인</p><label>이메일<input type="email" name="email" required></label><label>비밀번호<input type="password" name="password" required></label><button class="button primary">로그인</button><div id="error" class="error"></div></form><script>
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})});const d=await r.json();if(r.ok)location.href='/';else document.getElementById('error').textContent=d.error||'로그인 실패';});
</script></body></html>
