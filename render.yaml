services:
  - type: web
    name: build-signal
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_INGEST_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_SOURCE_MODE
        value: demo
      - key: PORT
        value: 10000
